[package]
name = "micnext"
version = "0.0.0"
edition.workspace = true

[dependencies]
mic-core = { path = "../../crates/mic-core" }
anyhow = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }
tokio-util = "0.7"
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
