[package]
name = "mic-store"
version = "0.0.0"
edition.workspace = true

[dependencies]
mic-message = { path = "../mic-message" }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt"] }
