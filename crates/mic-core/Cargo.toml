[package]
name = "mic-core"
version.workspace = true
edition.workspace = true

[dependencies]
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
croner = "3"
mic-media = { path = "../mic-media" }
mic-message = { path = "../mic-message" }
mic-store = { path = "../mic-store" }
mic-tool = { path = "../mic-tool" }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
schemars = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt", "macros", "sync", "time", "fs", "io-util", "process"] }
tokio-util = "0.7"
toml = "0.9"
tracing = "0.1"
futures-core = "0.3"

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
