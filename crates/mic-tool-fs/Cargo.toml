[package]
name = "mic-tool-fs"
version.workspace = true
edition.workspace = true

[dependencies]
tracing = "0.1"
mic-core = { path = "../mic-core" }
mic-message = { path = "../mic-message" }
mic-tool = { path = "../mic-tool" }
grep-regex = "0.1"
grep-searcher = "0.1"
ignore = "0.4"
schemars = "1"
serde = { version = "1", features = ["derive"] }
tempfile = "3"
tokio = { version = "1", features = ["rt"] }
