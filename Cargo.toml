[workspace]
resolver = "2"
members = [
    "crates/mic-message",
    "crates/mic-media",
    "crates/mic-store",
    "crates/mic-tool",
    "crates/mic-core",
    "crates/mic-provider-openai",
    "crates/mic-tool-shell",
    "crates/mic-tool-fs",
    "crates/mic-tool-web-fetch",
    "crates/mic-gateway",
    "crates/mic-channel-wechat",
    "bin/micnext",
]

[workspace.package]
# 主次版本手动维护；修订号由 bin/micnext/build.rs 按改动本行以来的提交数算出。
version = "0.2.0"
edition = "2021"
