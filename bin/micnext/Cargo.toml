[package]
name = "micnext"
version = "0.0.0"
edition.workspace = true

[dependencies]
mic-core = { path = "../../crates/mic-core" }
mic-gateway = { path = "../../crates/mic-gateway" }
mic-message = { path = "../../crates/mic-message" }
mic-store = { path = "../../crates/mic-store" }
mic-provider-openai = { path = "../../crates/mic-provider-openai" }
mic-tool-fs = { path = "../../crates/mic-tool-fs" }
mic-tool-shell = { path = "../../crates/mic-tool-shell" }
mic-tool-web-fetch = { path = "../../crates/mic-tool-web-fetch" }
anyhow = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }
tokio-util = "0.7"
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
