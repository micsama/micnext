# micnext 配置：只放启动必需的项，改完重启生效。人设、通用偏好、工作目录、轮数上限在网页「设置」里改。
# 模型与 API key 在网页「设置 → 模型」里添加；key 加密存库，主密钥默认在本文件旁的 master.key（权限 600，丢失后已存的 key 无法恢复）。

[core]
# 主密钥文件默认在配置文件旁的 master.key，需要改位置时取消下一行的注释。
# key_file = "~/.config/micnext/master.key"
# 数据库默认在 ~/.local/share/micnext/micnext.db，需要改位置时取消下一行的注释。
# data_dir = "~/.local/share/micnext"
# 你的名字：Web 与 -p 的输入都以这个身份写入。
owner = "dzmfg"

# Web 界面。启动时在终端打印带 token 的访问地址。
[gateway]
# 只在本机访问；改成 0.0.0.0:7878 会暴露到局域网，先想清楚。
# listen = "127.0.0.1:7878"
# 访问 token：不写则每次启动随机生成；写了就固定用它（地址可收藏）。
# token = "换成一串足够长的随机字符"
# 网页一键更新：填部署仓库根目录（绝对路径）；更新后以 <仓库>/target/release/micnext 原参数重启。
# 需要代理时在启动 shell 里先开好，git/bun/cargo 沿用。
# update_repo = "/root/workspace/micnext"
