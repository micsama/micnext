[package]
name = "mic-provider-openai"
version = "0.0.0"
edition.workspace = true

[dependencies]
mic-core = { path = "../mic-core" }
mic-message = { path = "../mic-message" }
mic-store = { path = "../mic-store" }
mic-tool = { path = "../mic-tool" }
async-openai = { version = "0.42", default-features = false, features = ["rustls", "chat-completion", "responses", "byot", "middleware", "model"] }
base64 = "0.22"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
reqwest = { version = "0.13", default-features = false }
secrecy = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["time"] }
tower = { version = "0.5", default-features = false }
