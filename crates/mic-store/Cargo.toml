[package]
name = "mic-store"
version = "0.0.0"
edition.workspace = true

[dependencies]
aes-gcm = "0.11.1"
mic-message = { path = "../mic-message" }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
