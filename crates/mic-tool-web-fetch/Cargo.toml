[package]
name = "mic-tool-web-fetch"
version.workspace = true
edition.workspace = true

[dependencies]
mic-core = { path = "../mic-core" }
mic-message = { path = "../mic-message" }
mic-tool = { path = "../mic-tool" }
encoding_rs = "0.8"
htmd = "0.2"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
