[package]
name = "mic-channel-wechat"
version = "0.0.0"
edition.workspace = true

[dependencies]
mic-core = { path = "../mic-core" }
mic-media = { path = "../mic-media" }
mic-message = { path = "../mic-message" }
mic-store = { path = "../mic-store" }
aes = "0.8"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
ecb = "0.1"
getrandom = "0.3"
md-5 = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_path_to_error = "0.1"
thiserror = "2"
tokio = { version = "1", features = ["fs", "macros", "rt", "sync", "time"] }
tokio-util = "0.7"
tracing = "0.1"
