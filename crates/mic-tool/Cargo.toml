[package]
name = "mic-tool"
version.workspace = true
edition.workspace = true

[dependencies]
mic-message = { path = "../mic-message" }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt"] }
tokio-util = { version = "0.7", features = ["rt"] }
